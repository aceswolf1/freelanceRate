# ---------------------------------------------------------------------------
# freelancer-invoices · full stack built from source (Postgres + API + Nuxt UI)
#   cp .env.example .env   # then edit, then: docker compose up -d --build
#   docker compose down    # `down -v` also drops the pgdata volume
#
# Only the frontend is published. The browser calls same-origin /api and the
# frontend proxies it to the backend over the internal network, so the API and
# the database are never exposed.
#
# For the NAS, use docker-compose.registry.yml (prebuilt GHCR images) instead —
# see deploy/AUTOMATION.md.
# ---------------------------------------------------------------------------

name: freelancer-invoices

services:
  # --- Database (stateful: never auto-updated) -----------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freelancer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freelancer}
      POSTGRES_DB: ${POSTGRES_DB:-freelancer_invoices}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      # Named volume — survives `docker compose down`; back it up with pg_dump.
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-freelancer}" -d "${POSTGRES_DB:-freelancer_invoices}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [appnet]

  # --- API (Express 5 + Drizzle) — internal only ---------------------------
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/aceswolf1}/freelancer-invoices-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4400"
      # Host `db` resolves on the Compose network, not on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-freelancer}:${POSTGRES_PASSWORD:-freelancer}@db:5432/${POSTGRES_DB:-freelancer_invoices}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Drives "today" and the Mon–Sun week boundaries — the server's local time.
      TZ: ${TZ:-UTC}
    mem_limit: 256m
    networks: [appnet]

  # --- UI (Nuxt 4) — the only published service ----------------------------
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/aceswolf1}/freelancer-invoices-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Where the /api proxy forwards to (internal network).
      NUXT_API_INTERNAL_BASE: http://backend:4400
      TZ: ${TZ:-UTC}
    ports:
      - "${APP_PORT:-3000}:3000"
    mem_limit: 384m
    networks: [appnet]

volumes:
  pgdata:
    driver: local

networks:
  appnet:
    driver: bridge
