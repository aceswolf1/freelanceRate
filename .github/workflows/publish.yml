name: Build and publish images

# Release flow: git tag vX.Y.Z && git push origin vX.Y.Z
# → tests → multi-arch images on GHCR (X.Y.Z, X.Y, latest)
# → Watchtower on the NAS pulls the new :latest and recreates frontend + backend.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: freelancer_invoices_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d freelancer_invoices_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/freelancer_invoices_test
      DATABASE_URL_TEST: postgres://ci:ci@localhost:5432/freelancer_invoices_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install, typecheck, migrate, test
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run db:migrate
          npm test

      - name: Frontend — install, typecheck, test
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:coverage

  # Each platform builds NATIVELY on its own runner (no QEMU emulation, which
  # crashed `npm ci` with SIGILL / exit 132 and stalled the arm64 builds), and
  # pushes an untagged image by digest. `merge` then assembles the multi-arch
  # manifest and applies the X.Y.Z, X.Y and latest tags.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR — no PAT needed
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Compute names # GHCR paths must be lowercase
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          platform="${{ matrix.platform }}"
          echo "image=ghcr.io/${owner}/freelancer-invoices-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.vars.outputs.pair }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ steps.vars.outputs.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.service }}-${{ steps.vars.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freelancer-invoices-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create multi-arch manifest and tags
        working-directory: ${{ runner.temp }}/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$META_JSON")
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.vars.outputs.image }}:${{ steps.meta.outputs.version }}"
