name: Build and publish images

# Release flow: git tag vX.Y.Z && git push origin vX.Y.Z
# → tests → multi-arch images on GHCR (X.Y.Z, X.Y, latest)
# → Watchtower on the NAS pulls the new :latest and recreates frontend + backend.
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: freelancer_invoices_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d freelancer_invoices_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/freelancer_invoices_test
      DATABASE_URL_TEST: postgres://ci:ci@localhost:5432/freelancer_invoices_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — install, typecheck, migrate, test
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run db:migrate
          npm test

      - name: Frontend — install, typecheck, test
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to GHCR — no PAT needed
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each service is self-contained (no COPY from the repo root).
          - { service: backend, context: ./backend, image: freelancer-invoices-backend }
          - { service: frontend, context: ./frontend, image: freelancer-invoices-frontend }
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase owner # GHCR paths must be lowercase
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4 # arm64 emulation
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
